<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حِسبَة</title>
  <meta name="description" content="تتبّع صرفياتك تلقائياً من رسائل البنك">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="حِسبَة">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>حِسبَة</h1>
    <div class="top-actions"><button class="paste-btn" id="paste-btn">📋 لصق رسالة</button>
      <button class="icon-btn" id="add-btn" aria-label="إضافة عملية">＋</button></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" role="tablist">
    <button data-tab="home" class="active"><span>📊</span>الملخص</button>
    <button data-tab="txs"><span>🧾</span>العمليات</button>
    <button data-tab="reports"><span>📈</span>التقارير</button>
    <button data-tab="commits"><span>📌</span>الالتزامات</button>
    <button data-tab="settings"><span>⚙️</span>الإعدادات</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
