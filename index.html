<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حِسبَة</title>
  <meta name="description" content="تتبّع صرفياتك تلقائياً من رسائل البنك">
  <meta name="theme-color" id="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="حِسبَة">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg?v=5" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=5">
  <link rel="preload" href="fonts/noto-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="greet"><div class="greet-t" id="greet-t"></div><div class="greet-s" id="greet-s"></div></div>
    <div class="top-actions"><button class="eye-btn" id="eye-btn" aria-label="إخفاء الأرقام"></button><button class="paste-btn" id="paste-btn">📋 لصق</button>
      <button class="icon-btn" id="add-btn" aria-label="إضافة عملية">＋</button></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" role="tablist">
    <span class="tab-ind" aria-hidden="true"></span>
    <button data-tab="home" data-ic="chart-bar" class="active"><span class="ti"></span>الملخص</button>
    <button data-tab="txs" data-ic="receipt"><span class="ti"></span>العمليات</button>
    <button data-tab="reports" data-ic="chart-line-up"><span class="ti"></span>التقارير</button>
    <button data-tab="commits" data-ic="push-pin"><span class="ti"></span>الالتزامات</button>
    <button data-tab="settings" data-ic="gear-six"><span class="ti"></span>الإعدادات</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
